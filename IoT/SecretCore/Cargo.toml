[package]
name = "secret_core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = "0.4.42"
futures = "0.3.32"
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", features = ["ecdh"] }
rand = "0.10.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rumqttc = "0.25.1"
scrypt = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.50.0", features = ["full"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase"] }

[profile.release]
# [重要] SecretCore の配布物は、デバッグ情報と余計な巻き戻し面を減らす。
# 理由: 高リスク処理の運用時に、解析面を小さくしつつ実行体を軽量化するため。
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
